services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ascertain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascertain}
      POSTGRES_DB: ${POSTGRES_DB:-ascertain_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ascertain} -d ${POSTGRES_DB:-ascertain_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ascertain:ascertain@db:5432/ascertain_dashboard}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SEED_COUNT: ${SEED_COUNT:-120}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

